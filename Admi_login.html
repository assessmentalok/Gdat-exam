<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
body{
font-family: Arial;
background: linear-gradient(to right,#141e30,#243b55);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:white;
padding:25px;
border-radius:15px;
width:320px;
box-shadow:0 0 15px rgba(0,0,0,0.3);
}

h2{
text-align:center;
margin-bottom:20px;
color:#333;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:10px;
background:#243b55;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#141e30;
}

#error{
color:red;
text-align:center;
margin-top:10px;
}
</style>
</head>

<body>

<div class="box">
<h2>Admin Login</h2>

<input type="text" id="aid" placeholder="Admin ID">
<input type="password" id="pass" placeholder="Password">

<button onclick="login()">Login</button>

<p id="error"></p>
</div>

<script>

let adminData = [];

fetch("data/admin_users.json")
.then(res=>res.json())
.then(data=>{
adminData = data;
});

function login(){

let id = document.getElementById("aid").value;
let pass = document.getElementById("pass").value;

let admin = adminData.find(a =>
a.adminId === id && a.password === pass
);

if(admin){

localStorage.setItem("adminName", admin.name);

window.location.href = "admin.html";

}else{

document.getElementById("error").innerText =
"Invalid Admin ID or Password";

}

}

</script>

</body>
</html>
