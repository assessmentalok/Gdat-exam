<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDAT Login</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f0f2f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:#fff;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
width:300px;
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:10px;
background:green;
color:white;
border:none;
cursor:pointer;
font-size:16px;
}

button:hover{
background:darkgreen;
}
</style>

</head>
<body>

<div class="login-box">

<h2>GDAT EXAM LOGIN</h2>

<input type="text" id="candidateId" placeholder="Candidate ID">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>
function login(){

let id=document.getElementById("candidateId").value;
let pass=document.getElementById("password").value;

if(id==="2609173187" && pass==="12345"){

localStorage.setItem("candidateName","Mamta");
window.location.href="exam.html";

}else{

alert("Wrong ID or Password");

}

}
</script>

</body>
</html>
