<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Login | CPSEWCCS</title>

<style>
/* CSS Reset & General Styling - UNTOUCHED */
*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body{
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Professional Background Gradient */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.box{
    background: white;
    padding: 35px 25px;
    border-radius: 16px;
    width: 100%;
    max-width: 400px; /* Thoda wide kiya taaki naam achha dikhe */
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    text-align: center;
}

/* Logo container style */
.logo-box {
    margin-bottom: 15px;
}

.logo-box img {
    max-width: 100px;
    height: auto;
}

/* Institute Title Style */
.institute-title {
    font-size: 15px;
    font-weight: bold;
    color: #0d47a1;
    text-transform: uppercase;
    line-height: 1.4;
    margin-bottom: 5px;
    letter-spacing: 0.3px;
}

.heading-tag {
    font-size: 13px;
    color: #666;
    margin-bottom: 25px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Input Fields Style */
.input-group {
    margin-bottom: 15px;
    text-align: left;
}

.input-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 5px;
}

input{
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: all 0.3s ease;
    background: #f8fafc;
}

input:focus{
    border-color: #0d47a1;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(13, 71, 161, 0.15);
}

/* Button Style */
button{
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #0d47a1, #1565c0);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(13, 71, 161, 0.2);
}

button:hover{
    transform: translateY(-1px);
    box-shadow: 0 6px 15px rgba(13, 71, 161, 0.3);
}

button:active {
    transform: translateY(1px);
}

#error{
    color: #dc3545;
    font-weight: 600;
    font-size: 14px;
    margin-top: 15px;
    min-height: 20px;
}

.footer-credit {
    font-size: 11px;
    color: #aaa;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="box">
    <div class="logo-box">
        <img src="CPSEWCCS.png" alt="CPSEWCCS Logo">
    </div>

    <div class="institute-title">
        Chaudhary Pawan Singh Educational Welfare Cultural & Charitable Society
    </div>
    <div class="heading-tag">Alok's Assesment Portal Login</div>

    <div class="input-group">
        <label for="cid">Candidate ID</label>
        <input type="text" id="cid" placeholder="Enter Candidate ID">
    </div>

    <div class="input-group">
        <label for="pass">Password</label>
        <input type="password" id="pass" placeholder="Enter Password">
    </div>

    <button onclick="login()">Login</button>

    <p id="error"></p>
    
    <div class="footer-credit">&copy; 2026 CPSEWCCS. All Rights Reserved.</div>
</div>
<script>
const FIREBASE_URL = "https://gdat-exam-default-rtdb.firebaseio.com/";
let users = [];

// 1. Load JSON Data Safely
fetch("users.json")
.then(res => {
    if(!res.ok) throw new Error("users.json not found");
    return res.json();
})
.then(data => {
    users = data;
    console.log("Users loaded successfully:", users.length);
})
.catch(err => {
    console.log("JSON Load Error:", err);
    document.getElementById("error").innerText = "⚠️ Configuration Error: users.json nahi mili.";
});

// 2. Main Login Engine (With Auto-Bypass on Network Fail)
async function login(){
    let id = document.getElementById("cid").value.trim();
    let pass = document.getElementById("pass").value.trim();
    let errorBox = document.getElementById("error");

    if(users.length === 0){
        errorBox.innerText = "Data load ho raha hai, kripya 2 second rukiye...";
        return;
    }

    // Match User Credentials
    let user = users.find(u =>
        String(u.candidateId).trim() === String(id) &&
        String(u.password).trim() === String(pass)
    );

    if(!user){
        errorBox.style.color = "#dc3545";
        errorBox.innerText = "Invalid Candidate ID or Password";
        return;
    }

    // If credentials are correct, proceed
    errorBox.style.color = "#0d47a1";
    errorBox.innerText = "Checking security status... Please wait...";

    let activeExamId = "gdat_test_v2"; // Default fallback ID
    let alreadySubmitted = false;

    try {
        // Fetch Exam Config (Set timeout of 3 seconds)
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000); // 3 second se zyada time laga to cancel

        const qRes = await fetch("questions.json", { signal: controller.signal });
        clearTimeout(timeoutId);

        if(qRes.ok) {
            const config = await qRes.json();
            activeExamId = config.examId || "gdat_test_v2";
        }

        // Fetch Firebase Results (Set timeout of 3 seconds)
        const fController = new AbortController();
        const fTimeoutId = setTimeout(() => fController.abort(), 3000);

        const resRes = await fetch(`${FIREBASE_URL}/results.json`, { signal: fController.signal });
        clearTimeout(fTimeoutId);

        if(resRes.ok) {
            const results = await resRes.json();
            if(results) {
                Object.keys(results).forEach(key => {
                    if(String(results[key].id).trim() === String(id) && results[key].examId === activeExamId) {
                        alreadySubmitted = true;
                    }
                });
            }
        }

    } catch(e) {
        // Agar network fail hua ya Firebase slow hua, toh ye block skip ho jayega aur login direct ho jayega
        console.warn("Network slow ya blocked hai. Bypassing security checks to log in...");
    }

    // Check if security blocked the user
    if(alreadySubmitted) {
        errorBox.style.color = "#dc3545";
        errorBox.innerText = "❌ Blocked: Aap is exam ko pehle hi submit kar chuke hain!";
        return;
    }

    // --- SUCCESS LOGIC ---
    errorBox.style.color = "#2e7d32";
    errorBox.innerText = "Login Successful! Redirecting...";

    // Voice Welcome
    if ('speechSynthesis' in window) {
        const msg = new SpeechSynthesisUtterance(`${user.name}, आलोक असेसमेंट पोर्टल पर आपका स्वागत है।`);
        msg.lang = 'hi-IN';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }

    // Save Data to LocalStorage
    localStorage.setItem("candidateId", user.candidateId);
    localStorage.setItem("candidateName", user.name);
    localStorage.setItem("currentActiveExamId", activeExamId);
    localStorage.removeItem("lastSubmittedExamId");
    
    // Redirect after a short delay
    setTimeout(() => {
        window.location.href = "exam.html";
    }, 800); 
}
</script>

</body>
</html>
